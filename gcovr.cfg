# Coverage settings for the wildebeest test suite.
#
# Usage (from the repository root, after running ctest on a build configured
# with -DWILDEBEEST_COVERAGE=ON):
#
#   gcovr --object-directory <build dir>
#
# Only the plugin sources under src/ count.  The pmgen-generated DSP matcher
# (<build>/architecture/zeroasic_dsp/zeroasic_dsp.h) is reported separately in
# CI for information only: most of its generated code can never run.
root = .
filter = src/
exclude-unreachable-branches = yes
exclude-throw-branches = yes
exclude-noncode-lines = yes
print-summary = yes
